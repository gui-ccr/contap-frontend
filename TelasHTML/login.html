<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-body-md text-on-surface">
<!-- Ambient Background Accents -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-tertiary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Login Container -->
<main class="w-full max-w-[420px] px-margin-mobile md:px-0 relative z-10">
<div class="bg-surface-container/70 glass-panel border border-white/5 rim-light rounded-xl p-lg shadow-2xl flex flex-col gap-xl">
<!-- Header Section -->
<header class="flex flex-col items-center gap-sm text-center">
<div class="w-12 h-12 bg-surface-container-highest rounded-lg flex items-center justify-center border border-white/5 rim-light mb-2">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">
                        account_balance
                    </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">ContaUp</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Acesse sua plataforma financeira.</p>
</header>
<!-- Form Section -->
<form action="dashboard.html" class="flex flex-col gap-gutter" method="GET">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Corporativo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/50 pointer-events-none">
                            mail
                        </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-11 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all shadow-inner" id="email" name="email" placeholder="nome@empresa.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Senha</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">
                            Esqueci minha senha
                        </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/50 pointer-events-none">
                            lock
                        </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT pl-11 pr-11 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all shadow-inner" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">
                                visibility_off
                            </span>
</button>
</div>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full bg-primary hover:bg-primary-fixed text-on-primary font-label-md text-label-md py-3 px-4 rounded-DEFAULT transition-all duration-200 flex justify-center items-center gap-base shadow-lg shadow-primary/20" type="submit">
                        Entrar no Sistema
                        <span class="material-symbols-outlined text-[18px]">
                            arrow_forward
                        </span>
</button>
</div>
</form>
<!-- Footer Note -->
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant/60">
                    Ambiente seguro e criptografado.
                </p>
</div>
